name: CI Mamute Core

# Este repo e o NUCLEO ABERTO do Mamute Politico (API + coletores). O deploy de
# producao NAO mora aqui: vive no repo privado correiosabia/mamute-politico-app,
# que recompoe a arvore com este repo em cada deploy. Merge na main daqui NAO
# deploya sozinho — o proximo deploy do app (push la, ou Run workflow) leva o
# main mais recente daqui junto.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  api-smoke:
    name: API — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install deps
        working-directory: api
        run: pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest api/tests/ -v

  # Builda a MESMA imagem que vai para producao (Dockerfile, Python da imagem,
  # resolucao de dependencias do dia) e importa o app com a URL no formato do
  # compose. O job de pytest acima roda em outro Python e com outra resolucao;
  # foi esse vao que deixou o SQLAlchemy 2.1 derrubar a API em 28/09 (CS-103).
  api-image-smoke:
    name: API — imagem Docker sobe
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      # Mesmo motivo: o FROM python:... sai do espelho, sem o limite do Docker Hub.
      - name: Usa o espelho do Docker Hub
        run: |
          echo '{"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - name: Build da imagem
        run: docker build -t mamute-api-smoke:ci api/

      - name: Import do app dentro da imagem
        run: |
          docker run --rm \
            -e DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:5432/smoke \
            mamute-api-smoke:ci \
            python -c "import sqlalchemy, main; from db.engine import engine; print('SQLAlchemy', sqlalchemy.__version__, 'driver', engine.dialect.driver)"

  scrappers-tests:
    name: Scrappers — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mamute_scrappers/requirements-dev.txt

      - name: Install deps
        working-directory: mamute_scrappers
        run: pip install -r requirements-dev.txt

      - name: Pytest
        run: pytest mamute_scrappers/tests/ -v

  migration-smoke:
    name: Migrations — alembic upgrade head
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        # Espelho do Google: o Docker Hub limita pull anônimo por IP e os runners
        # do GitHub são compartilhados (429 em 09/10/2026).
        image: mirror.gcr.io/pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mamute_test
          POSTGRES_PASSWORD: mamute_test
          POSTGRES_DB: mamute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mamute_test -d mamute_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mamute_scrappers/requirements.txt

      - name: Install deps
        working-directory: mamute_scrappers
        run: pip install -r requirements.txt

      - name: Habilita extensao pgvector
        env:
          PGPASSWORD: mamute_test
        run: psql -h localhost -U mamute_test -d mamute_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Alembic upgrade head
        working-directory: mamute_scrappers
        env:
          DATABASE_URL: postgresql+psycopg2://mamute_test:mamute_test@localhost:5432/mamute_test
        run: alembic upgrade head
